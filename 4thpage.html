<!DOCTYPE html>
<html>
    <head>
        <title>calculator</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    </head>
    <body>
      <div class="form-container">
        <form id="eligibility">
          <div class = "input-storage">
            <label for = "username">Username</label>
            <input id="username" type = "text" required placeholder = "Enter your username">
          </div>
          <div class = "input-storage">
            <label for = "userage">Age</label>
            <input id="userage" type = "number" required placeholder = "Enter your age">
          </div>
          <div class = "input-storage">
            <label for = "gender">Gender</label>
            <input id="gender" type = "checkbox" value = "male">
            <label for = "gender">Male</label>
            <input id="gender" type = "checkbox" value = "female">
            <label for = "gender">Female</label>
          </div>
          <button type ="submit">Submit</button>
        </form>
     <p id="result"></p>
    </body>
    <script>
    document.getElementById("eligibility").addEventListener("submit", function(event) {
        event.preventDefault();
        const name = document.getElementById("username").value;
        const age = Number(document.getElementById("userage").value);
        const result = document.getElementById("result");
        if (age >= 18) {
            result.textContent = `Hello ${name}! You are eligible`;
        } else {
            result.textContent = `Hello ${name}! You are not eligible`;
        }
    });
    </script>
</html>
